# Parámetros del simulador basado en agentes.
# Todas las tasas son por usuario. Los valores pueden calibrarse con
# estadísticas agregadas (anónimas) de una plataforma real.

start: "2026-01-05T00:00:00"
horizon_hours: 72
output_dir: data/raw
n_common_phrases: 40             # vocabulario de frases comunes ("hola", "ok"), popularidad tipo Zipf

agent_types:
  legit:
    sessions_per_day: 2.0        # media; cada usuario tiene su propio multiplicador Gamma
    activity_gamma_shape: 1.5    # heterogeneidad entre usuarios (menor = más dispersión)
    msgs_per_session: 6.0
    gap_seconds: 60              # tiempo medio entre mensajes de una sesión
    contacts: 6                  # tamaño medio del grupo de destinatarios
    link_prob: 0.02
    n_templates: null            # null = texto libre (plantilla prácticamente única)
    msg_len_mean: 45
    account_age_days: 120        # media exponencial
    geo_jump_prob: 0.01          # probabilidad de aparecer en otra ciudad (VPN, GPS falso); en bots es alta
    reply_prob_received: 0.55    # probabilidad de que un usuario real responda a este tipo de agente
    common_phrase_prob: 0.3     # proporción de mensajes que son frases comunes

  naive_bot:
    sessions_per_day: 12.0
    activity_gamma_shape: 8.0
    msgs_per_session: 35.0
    gap_seconds: 5
    contacts: 300
    link_prob: 0.70
    n_templates: 2
    msg_len_mean: 90
    account_age_days: 0.5
    geo_jump_prob: 0.9
    reply_prob_received: 0.01
    common_phrase_prob: 0.0     # proporción de mensajes que son frases comunes

  adaptive_bot:
    sessions_per_day: 2.5
    activity_gamma_shape: 3.0
    msgs_per_session: 9.0
    gap_seconds: 40
    contacts: 60
    link_prob: 0.25
    n_templates: 10
    msg_len_mean: 60
    account_age_days: 5
    geo_jump_prob: 0.2
    reply_prob_received: 0.08
    common_phrase_prob: 0.1     # proporción de mensajes que son frases comunes

  stealth_bot:
    sessions_per_day: 2.0
    activity_gamma_shape: 3.0
    msgs_per_session: 7.0
    gap_seconds: 70
    contacts: 25
    link_prob: 0.08
    n_templates: 25
    msg_len_mean: 40
    account_age_days: 20
    geo_jump_prob: 0.0
    reply_prob_received: 0.20
    common_phrase_prob: 0.3     # proporción de mensajes que son frases comunes

# Respuestas de usuarios reales: número de mensajes de respuesta = 1 + Poisson(media)
reply_msgs_mean: 1.5
reply_delay_minutes: 10

scenarios:
  train:
    seed: 42
    counts: {legit: 4000, naive_bot: 150, adaptive_bot: 250}
  test:
    seed: 7
    counts: {legit: 2000, naive_bot: 75, adaptive_bot: 125, stealth_bot: 150}
